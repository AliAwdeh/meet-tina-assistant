[project]
name = "meet-tina-backend"
version = "0.1.0"
description = "Production-oriented AI personal assistant backend for WhatsApp, LangGraph, FastAPI, PostgreSQL, Redis, and n8n."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "openai>=1.40",
  "apscheduler>=3.10",
  "pyjwt>=2.8",
  "email-validator>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
meet-tina-scheduler = "app.scheduler.runner:main"
meet-tina-worker = "app.workers.media_worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
